name: deploy-production

on:
  workflow_run:
    workflows: [regression]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwrg-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://dwrg.fangwenky.dpdns.org
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure dedicated deployment SSH key
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' '${{ secrets.VPS_SSH_PRIVATE_KEY }}' > ~/.ssh/dwrg_deploy
          chmod 600 ~/.ssh/dwrg_deploy
          printf '%s\n' '${{ secrets.VPS_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload immutable release candidate
        shell: bash
        run: |
          test "$DEPLOY_SHA" != ""
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            -e "ssh -i ~/.ssh/dwrg_deploy -p $VPS_PORT -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:/opt/dwrg/incoming/$DEPLOY_SHA/"

      - name: Backup, deploy, and verify on VPS
        shell: bash
        run: |
          ssh -i ~/.ssh/dwrg_deploy -p "$VPS_PORT" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/dwrg-deploy '$DEPLOY_SHA'"

      - name: Verify public endpoints
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://dwrg.fangwenky.dpdns.org/api/health
          for path in / /events /login; do
            curl --fail --silent --show-error --retry 3 --output /dev/null "https://dwrg.fangwenky.dpdns.org$path"
          done

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '### DWRG production deployment'
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo '- Target: https://dwrg.fangwenky.dpdns.org'
            echo "- Result: \`$([[ '${{ job.status }}' == 'success' ]] && echo healthy || echo failed)\`"
          } >> "$GITHUB_STEP_SUMMARY"
