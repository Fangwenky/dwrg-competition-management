# Only state-changing authentication submissions consume this budget. Next.js
# prefetches /login and /register with GET requests; counting those requests can
# lock a real user out while they are only browsing.
map $request_method $dwrg_auth_limit_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $dwrg_auth_limit_key zone=dwrg_auth_post:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dwrg_upload:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name dwrg.fangwenky.dpdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dwrg.fangwenky.dpdns.org;

    # Trust visitor IP headers only when the connection comes from a published Cloudflare edge range.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    ssl_certificate /etc/letsencrypt/live/dwrg.fangwenky.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dwrg.fangwenky.dpdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 6m;

    location ^~ /uploads/rank_screenshot/ {
        return 404;
    }

    location /uploads/ {
        alias /opt/dwrg/data/uploads/;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location ~ ^/(login|register)$ {
        limit_req zone=dwrg_auth_post burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3300;
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/uploads {
        limit_req zone=dwrg_upload burst=5 nodelay;
        proxy_pass http://127.0.0.1:3300;
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
